<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selina 的个人主页</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0;
      line-height: 1.7;
      color: #1f2328;
      background: #ffffff;
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #d0d7de;
    }
    nav .brand {
      font-weight: 600;
      font-size: 1rem;
      color: #1f2328;
      text-decoration: none;
    }
    nav .links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    nav a {
      color: #0969da;
      text-decoration: none;
      font-size: 0.94rem;
    }
    nav a:hover { text-decoration: underline; }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 24px 80px;
    }
    section {
      padding: 48px 0 24px;
      border-bottom: 1px solid #d8dee4;
      scroll-margin-top: 64px;
    }
    section:last-child {
      border-bottom: none;
    }
    h1 { font-size: 2rem; margin: 0 0 0.2em; }
    h2 { font-size: 1.4rem; margin: 0 0 0.6em; }
    p { margin: 0.6em 0; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .meta { color: #656d76; font-size: 0.9rem; }
    .card {
      margin-top: 14px;
      padding: 14px 16px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }
    @media (max-width: 520px) {
      nav { flex-direction: column; align-items: flex-start; }
      nav .links { gap: 14px; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="#top">Selina</a>
    <div class="links">
      <a href="#about">关于我</a>
      <a href="#projects">项目</a>
      <a href="#contact">联系</a>
    </div>
  </nav>

  <main id="top">
    <section id="about">
      <h1>你好，我是 Selina</h1>
      <p class="meta">通过 GitHub Pages 发布的个人主页</p>
      <p>这是我的第一个 GitHub Pages 站点。后续可以在这里放简历、项目作品或博客文章。</p>
    </section>

    <section id="projects">
      <h2>项目</h2>
      <p>我的公开项目与代码托管在 GitHub，欢迎查看。</p>
      <div class="card">
        <a href="https://github.com/Selina-L">GitHub 主页 →</a>
      </div>
    </section>

    <section id="contact">
      <h2>联系</h2>
      <p>最便捷的方式是通过 GitHub 关注我；如有问题，也可以在仓库中提出 Issue。</p>
      <div class="card">
        <a href="https://github.com/Selina-L">在 GitHub 上联系 →</a>
      </div>
    </section>
  </main>
</body>
</html>
